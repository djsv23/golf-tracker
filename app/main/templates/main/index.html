{% extends "base.html" %}
{% from '_macros.html' import round_summary_card %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
	<h1>Hello, {{ current_user.username }}!</h1>
	<div>
		<a href="{{ url_for('rounds.new') }}" class="btn btn-primary">Record a round</a>
		<a href="{{ url_for('rounds.list_rounds') }}" class="btn btn-outline-secondary">View all rounds</a>
	</div>
</div>
{% for round in rounds %}
	{{ round_summary_card(round) }}
{% else %}
<p class="text-muted">No rounds recorded yet.</p>
{% endfor %}
{% endblock %}
